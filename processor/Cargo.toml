[package]
name = "processor"
version = "0.1.0"
edition = "2021"
description = "Обработчик пакетов измерений: читает inbox общего volume, пишет отчёты в outbox"
license = "MIT"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Маленький синхронный HTTP-сервер для /health и /metrics: тянет мало зависимостей,
# поэтому быстро собирается и не раздувает статический бинарь.
tiny_http = "0.12"
# termination — обрабатывать и SIGTERM (docker stop), а не только Ctrl+C.
ctrlc = { version = "3", features = ["termination"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
